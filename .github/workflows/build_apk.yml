name: Build ITLA Organizer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android native project
        run: |
          mkdir -p /tmp/backup_manifest
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml || true
          rm -rf android
          flutter create . --org com.itla --project-name itla_organizador --platforms android
          cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-ITLA-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: App Organizadora ITLA v1.0.1
          body: |
            ### App Organizadora ITLA - Versión 1.0.1
            - Corrección de URL oficial de Aula Virtual ITLA (https://aulavirtual.itla.edu.do/lgnx).
            - Soporte para inicio de sesión directo con Microsoft Office 365.
            - Modo local / offline habilitado.
          files: build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true
